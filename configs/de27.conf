config_base[take_snapshots]=true
config_base[run_vm_after_installation]=false
config_base[access_pass_length]=6

# =------------- Конфигурация стендов ДЭ-2027, КИМ 09.02.06-1-2027 (НСГК) -------------=
#
#  Файл импортируется скриптом PVE-ASDaC-BASH.sh ключом:  -c de27.conf -z
#  При запуске скрипт предложит выбрать вариант развёртывания:
#    1 — Задание 1:      EcoRouter (Pesto) + Ideco NGFW v23 + Альт 11
#    2 — Задание 1:      все ВМ на Альт 11 (BR-FW и маршрутизаторы — Альт Сервер)
#    3 — Задания 2 и 3:  EcoRouter + Ideco + Альт, 2 доп. диска 1 ГБ на HQ-SRV, Additional.iso
#
#  Образы дисков ищутся в каталоге /root/de27/images (см. README.md, раздел «Образы»).
#  Имена файлов образов задаются ниже в шаблонах (boot_disk_0) и в iso_1.
#
#  Сетевые адаптеры ВМ на Альт подключаются как net0, net1, net2 — внутри ВМ они получают
#  имена ens18, ens19, ens20 (как в шаблоне отчёта КИМ и в методичках ДЭ-2027).
#
# =----------------------------------------------------------------------------------------=

#///  Базовые параметры — в самом начале файла (первая строка файла не должна быть комментарием:
#///  иначе утилита file определяет тип не как text/plain, и скрипт отказывается импортировать конфиг)


#///::::::::::::::::::::::::::::::::| Роли прав доступа |:::::::::::::::::::::::::::::::::::\\\#

# Участник: видит ВМ своего пула, консоль, включение/выключение
config_access_roles[Competitor_DE]='Pool.Audit VM.Audit VM.Console VM.PowerMgmt'
# Право менять сетевой адаптер ВМ (тег VLAN на HQ-SRV и HQ-CLI — пункт 4 задания 1)
config_access_roles[Competitor_DE-SDN]='VM.Config.Network'
# Право использовать мост HQ-Net (без SDN.Use PVE 8+ не даст сменить тег VLAN).
# Назначается на мост там, где он создаётся впервые, — у HQ-RTR (network_7 / network_1)
config_access_roles[Competitor_DE-VLAN]='SDN.Use SDN.Audit'

#///%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%| Шаблоны ВМ |%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%\\\#

config_templates[Alt-Server-11.1]='
        templ_descr = Альт Сервер 11.1
        os_descr    = Альт Сервер 11.1
        tags        = alt_server_11.1
        ostype      = l26
        serial0     = socket
        agent       = 1
        tablet      = 0
        scsihw      = virtio-scsi-single
        cpu         = host
        cores       = 1
        memory      = 2048
        boot_disk_0 = /root/de27/images/Alt-SRV_11.1.qcow2
'

config_templates[Alt-Workstation-11.2]='
        templ_descr = Альт Рабочая станция 11.2
        os_descr    = Альт Рабочая станция 11.2
        tags        = alt_workstation_11.2
        ostype      = l26
        serial0     = socket
        agent       = 1
        scsihw      = virtio-scsi-single
        cpu         = host
        cores       = 2
        memory      = 3072
        boot_disk_0 = /root/de27/images/Alt-WS_11.2.qcow2
'

config_templates[EcoRouterOS_Pesto]='
        templ_descr = EcoRouterOS (Pesto)
        os_descr    = EcoRouterOS (Pesto)
        tags        = ecorouter
        ostype      = l26
        machine     = pc-i440fx-7.0
        cpu         = host
        cores       = 2
        cpulimit    = 1
        cpuunits    = 75
        memory      = 4096
        serial0     = socket
        tablet      = 0
        disk_type   = ide
        netifs_type = vmxnet3
        netifs_mac  = 1C:87:76:40
        network_0   = { bridge=inet, state=down }
        boot_disk_0 = /root/de27/images/EcoRouterOS.qcow2
'

config_templates[Ideco-NGFW]='
        templ_descr = Ideco NGFW v23
        os_descr    = Ideco NGFW v23
        tags        = ideco-ngfw
        ostype      = l26
        serial0     = socket
        bios        = ovmf
        agent       = 1
        tablet      = 0
        scsihw      = virtio-scsi-single
        cpu         = host
        cores       = 2
        memory      = 7168
        boot_disk_0 = /root/de27/images/NGFW.qcow2
'

#///============================ Вариант 1. Задание 1: EcoRouter + Ideco + Альт ============================\\\#

config_stand_1_var[stand_config]='
description      = ДЭ-2027 09.02.06. Задание 1 (EcoRouter Pesto + Ideco NGFW v23 + Альт 11)
pool_name        = DE27_Z1_stand_{0}
pool_desc        = Стенд участника ДЭ-2027 «Сетевое и системное администрирование», задание 1. Место {0}
access_user_name = Student_Z1_{0}
access_user_desc = Учётная запись участника ДЭ-2027 (задание 1), место {0}
pool_access_role = Competitor_DE
'

config_stand_1_var[vm_1]='
name            = ISP
config_template = Alt-Server-11.1
memory          = 1024
startup         = order=1,up=10,down=30
firewall_opt    = { enable=1, dhcp=1 }
network_0       = { bridge=inet, firewall=1 }
network_1       = 🖧: ISP-HQ
network_2       = 🖧: ISP-BR
'

config_stand_1_var[vm_2]='
name            = HQ-RTR
config_template = EcoRouterOS_Pesto
startup         = order=3,up=10,down=30
network_6       = 🖧: ISP-HQ
network_7       = { bridge="🖧: HQ-Net", vlan_aware=1, access_role=Competitor_DE-VLAN }
'

config_stand_1_var[vm_3]='
name            = BR-RTR
config_template = EcoRouterOS_Pesto
startup         = order=3,up=10,down=30
network_6       = 🖧: ISP-BR
network_7       = 🖧: FW-Net
'

config_stand_1_var[vm_4]='
name            = BR-FW
config_template = Ideco-NGFW
startup         = order=2,up=20,down=30
network_0       = 🖧: FW-Net
network_1       = 🖧: BR-Net
'

config_stand_1_var[vm_5]='
name            = HQ-SRV
config_template = Alt-Server-11.1
startup         = order=4,up=5,down=30
network_0       = 🖧: HQ-Net
access_role     = Competitor_DE-SDN
'

config_stand_1_var[vm_6]='
name            = HQ-CLI
config_template = Alt-Workstation-11.2
startup         = order=5,up=5,down=30
network_0       = 🖧: HQ-Net
access_role     = Competitor_DE-SDN
'

config_stand_1_var[vm_7]='
name            = BR-SRV
config_template = Alt-Server-11.1
startup         = order=4,up=5,down=30
network_0       = 🖧: BR-Net
'

